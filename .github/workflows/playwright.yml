name: SauceDemo Automated Regression Suite

on:
  # 1. Automatsko pokretanje pri svakom push-u ili PR-u na main granu
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

  # 2. Noćno automatsko pokretanje (Svaki dan u 02:00 UTC)
  schedule:
    - cron: "0 2 * * *"

  # 3. Omogućava ručno pokretanje testova na dugme sa GitHub UI-ja
  workflow_dispatch:

jobs:
  playwright-tests:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Execute Playwright Tests
        run: npx playwright test

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-execution-report
          path: playwright-report/
          retention-days: 14
